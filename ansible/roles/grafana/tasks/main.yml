---
- name: Install prerequisites
  ansible.builtin.apt:
    name: [apt-transport-https, software-properties-common, wget, adduser, libfontconfig1]
    state: present
    update_cache: true

- name: Add Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /usr/share/keyrings/grafana.key
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.key] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: "grafana={{ grafana_version }}"
    state: present
    update_cache: true

- name: Create provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - "{{ grafana_provisioning_dir }}/datasources"
    - "{{ grafana_provisioning_dir }}/dashboards"
    - "{{ grafana_data_dir }}/dashboards"

- name: Deploy Grafana config
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_dir }}/grafana.ini"
    owner: root
    group: grafana
    mode: "0640"
  notify: restart grafana

- name: Provision Prometheus datasource
  ansible.builtin.copy:
    src: datasource.yml
    dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Deploy dashboard provisioning config
  ansible.builtin.template:
    src: dashboard_provider.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/provider.yml"
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Deploy ROS2 fleet dashboard
  ansible.builtin.copy:
    src: dashboard_ros2_fleet.json
    dest: "{{ grafana_data_dir }}/dashboards/ros2_fleet.json"
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
