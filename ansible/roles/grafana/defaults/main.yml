---
grafana_version: "10.4.2"
grafana_port: 3000
grafana_admin_user: admin
# grafana_admin_password must be set via ansible-vault in group_vars/all/vault.yml
# ansible-vault encrypt_string 'your_password' --name 'grafana_admin_password'
grafana_install_dir: /usr/local/bin
grafana_config_dir: /etc/grafana
grafana_data_dir: /var/lib/grafana
grafana_log_dir: /var/log/grafana
grafana_plugins_dir: /var/lib/grafana/plugins
grafana_provisioning_dir: /etc/grafana/provisioning
prometheus_url: "http://localhost:9090"
