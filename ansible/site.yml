---
- name: Install node_exporter on all robot nodes
  hosts: robots
  become: true
  roles:
    - node_exporter

- name: Deploy ROS2 robot nodes
  hosts: robots
  become: true
  roles:
    - ros2_robot

- name: Deploy Prometheus + Grafana on monitoring node
  hosts: monitoring
  become: true
  roles:
    - prometheus
    - grafana
